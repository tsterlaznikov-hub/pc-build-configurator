{% extends 'configurator/base.html' %}

{% block title %}Удалить сборку{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 text-center">
                <i class="bi bi-trash display-1 text-danger mb-3"></i>
                <h2 class="fw-bold mb-3">Удалить сборку?</h2>
                <p class="text-muted mb-4">
                    Вы уверены, что хотите удалить сборку
                    <strong>«{{ build.name }}»</strong>?
                    Это действие нельзя отменить.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Да, удалить
                        </button>
                        <a href="{% url 'build_detail' build.pk %}" class="btn btn-outline-secondary">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
