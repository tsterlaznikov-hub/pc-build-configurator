{% extends 'configurator/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h2 class="fw-bold mb-4 text-center">
                    <i class="bi bi-box-arrow-in-right"></i> Вход
                </h2>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Имя пользователя</label>
                        <input type="text" name="username" class="form-control" placeholder="Имя пользователя" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Пароль</label>
                        <input type="password" name="password" class="form-control" placeholder="Пароль" required>
                    </div>
                    {% if form.errors %}
                    <div class="alert alert-danger">
                        Неверное имя пользователя или пароль.
                    </div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </button>
                    <p class="text-center text-muted mb-0">
                        Нет аккаунта?
                        <a href="{% url 'register' %}">Зарегистрироваться</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
